name: secure-fix-issue
description: |
  Use when: User wants to FIX a GitHub issue AND have the result security-verified
  by SonarQube before a pull request is ever opened.
  Triggers: "securely fix issue #123", "fix and security-scan", "secure fix".
  NOT for: Plain issue fixes with no security gate (use fix-issue).

  This is fix-issue plus a verification gate. The diff is four things:
  1. the pull request opens FIRST, as a draft, so the analysis can be scoped to it
  2. a bash node that runs the SonarQube analysis for that pull request
     (no AI in it, so it cannot decide to skip itself)
  3. an MCP node that reads the pull request's quality gate and remediates
  4. a bash node that re-checks the gate from outside, and one dependency edge:
     ready-pr depends on THAT node, not on the agent's own report

  Because the analysis is scoped to the pull request, GitHub and SonarQube are
  talking about the same thing: Sonar reports on PR #N, and the check on PR #N in
  GitHub carries that verdict. A red gate leaves the pull request a draft.

  Every AI node runs a command file from .archon/commands/ rather than an inline
  prompt, and passes its data in through `with:` bindings. Models are named by tier
  (small / medium / large), not by model name, so the same workflow runs on any
  configured provider.

  Full sequence:
  1. Fetch the issue named in the run message
  2. Classify it (bug / feature / enhancement / ...)
  3. Route to investigate (bugs) or plan (everything else)
  4. Implement the fix
  5. Open the pull request as a draft
  6. Analyse that pull request with sonar-scanner
  7. Verify against the pull request's quality gate via the SonarQube MCP server -
     autonomously remediate findings and re-scan, up to 3 cycles, until it passes
  8. Re-check the gate from outside the agent, then mark the pull request ready
  9. Report results back to the GitHub issue

  Sonar is the verification layer: the pull request cannot leave draft until the
  gate on that pull request is green.

provider: claude
model: medium

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: FETCH & CLASSIFY   (identical to fix-issue)
  # ═══════════════════════════════════════════════════════════════

  - id: fetch-issue
    bash: |
      set -uo pipefail
      # $ARGUMENTS arrives as a subprocess environment variable, never spliced
      # into this script, so an issue title can't break out of the command.
      ISSUE_NUMBER=$(printf '%s' "${ARGUMENTS:-}" | grep -oE '[0-9]+' | head -1)
      if [ -z "$ISSUE_NUMBER" ]; then
        echo "ERROR: no issue number found in the run message." >&2
        exit 1
      fi
      echo "Fetching issue #${ISSUE_NUMBER}" >&2
      gh issue view "$ISSUE_NUMBER" --json title,body,labels,comments,state,url,author

  - id: classify
    command: classify-issue
    with:
      issue: $fetch-issue.output
    depends_on: [fetch-issue]
    model: small
    allowed_tools: []
    output_format:
      type: object
      properties:
        issue_type:
          type: string
          enum: ["bug", "feature", "enhancement", "refactor", "chore", "documentation"]
        title:
          type: string
        reasoning:
          type: string
      required: [issue_type, title, reasoning]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: INVESTIGATE (bugs) / PLAN (everything else)
  # ═══════════════════════════════════════════════════════════════

  - id: investigate
    command: archon-investigate-issue
    depends_on: [classify]
    when: "$classify.output.issue_type == 'bug'"
    context: fresh

  - id: plan
    command: archon-create-plan
    depends_on: [classify]
    when: "$classify.output.issue_type != 'bug'"
    context: fresh

  # Bridge: archon-fix-issue reads $ARTIFACTS_DIR/investigation.md;
  # archon-create-plan writes plan.md. Copy plan.md -> investigation.md if needed.
  - id: bridge-artifacts
    bash: |
      if [ -f "$ARTIFACTS_DIR/plan.md" ] && [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then
        cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/investigation.md"
        echo "Bridged plan.md to investigation.md for implement step"
      elif [ -f "$ARTIFACTS_DIR/investigation.md" ]; then
        echo "investigation.md exists from investigate step"
      else
        echo "WARNING: No investigation.md or plan.md found - implement may fail"
      fi
    depends_on: [investigate, plan]
    trigger_rule: one_success

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    command: archon-fix-issue
    depends_on: [bridge-artifacts]
    context: fresh


  # ═══════════════════════════════════════════════════════════════
  # ADDITION 1 of 4: OPEN THE PULL REQUEST FIRST, AS A DRAFT
  #
  # The pull request exists before anything is scanned, on purpose. A SonarQube
  # pull-request analysis has to be told which pull request it belongs to, so the
  # pull request has to be there first. That is also what puts the result in
  # GitHub: Sonar reports on PR #N, and GitHub shows that verdict on PR #N.
  #
  # It opens as a DRAFT and stays one until the gate is green.
  # ═══════════════════════════════════════════════════════════════

  - id: open-pr
    command: create-draft-pr
    with:
      classification: $classify.output
    depends_on: [implement]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # ADDITION 2 of 4: THE SCAN
  # A bash node. There is no model in it, so it cannot decide to skip itself.
  # Scoped to the pull request, so the findings land on PR #N in SonarQube.
  # ═══════════════════════════════════════════════════════════════

  - id: sonar-scan
    bash: |
      set -uo pipefail
      export PATH="$HOME/AppData/Roaming/npm:$HOME/.local/bin:$PATH"
      echo "=== SonarQube analysis: submitting the pull request for scanning ==="
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "ERROR: SONAR_TOKEN is not set in the environment." >&2
        exit 1
      fi
      if ! command -v sonar-scanner >/dev/null 2>&1; then
        echo "ERROR: sonar-scanner is not on PATH." >&2
        exit 1
      fi

      PR_NUMBER=$(tr -dc '0-9' < "$ARTIFACTS_DIR/.pr-number" 2>/dev/null)
      if [ -z "$PR_NUMBER" ]; then
        echo "ERROR: no pull request number in the artifacts directory." >&2
        echo "The pull request must exist before a PR-scoped analysis can run." >&2
        exit 1
      fi
      BRANCH=$(git branch --show-current)
      echo "Analysing PR #${PR_NUMBER} (${BRANCH} into ${BASE_BRANCH})"

      # Record what the project already carried BEFORE publishing this analysis,
      # so the guard downstream can tell "already there" from "this change added it".
      python tools/dependency-risk-guard.py snapshot "$ARTIFACTS_DIR/dep-baseline.json"

      sonar-scanner \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.pullrequest.key="$PR_NUMBER" \
        -Dsonar.pullrequest.branch="$BRANCH" \
        -Dsonar.pullrequest.base="$BASE_BRANCH"
      echo "=== Analysis submitted for PR #${PR_NUMBER} ==="
    depends_on: [open-pr]
    timeout: 900000

  # ═══════════════════════════════════════════════════════════════
  # ADDITION 3 of 4: THE REMEDIATION
  # Reads the pull request's quality gate over MCP, fixes what fails, re-scans.
  # Max 3 cycles.
  # ═══════════════════════════════════════════════════════════════

  - id: sonar-verify
    command: sonar-verify
    depends_on: [sonar-scan]
    context: fresh
    mcp: .archon/mcp/sonarqube.json
    timeout: 1800000

  # ═══════════════════════════════════════════════════════════════
  # ADDITION 4 of 4: THE ASSERTION, AND THE EDGE
  #
  # sonar-verify is an AI node. Letting it decide would mean depending on a
  # model's own report that it succeeded, which is the exact thing this workflow
  # argues against. This node re-checks both claims from the outside, against
  # SonarQube's API, for this pull request. No model in it.
  #
  # `ready-pr` depends on THIS node, not on sonar-verify. That edge is the whole
  # argument: the pull request cannot leave draft except through a step that has
  # no model in it.
  # ═══════════════════════════════════════════════════════════════

  - id: verify-gate
    bash: |
      set -uo pipefail
      export PATH="$HOME/AppData/Roaming/npm:$HOME/.local/bin:$PATH"
      echo "=== Verifying the result independently of the agent's own report ==="
      PR_NUMBER=$(tr -dc '0-9' < "$ARTIFACTS_DIR/.pr-number" 2>/dev/null)
      if [ -z "$PR_NUMBER" ]; then
        echo "ERROR: no pull request number to verify." >&2
        exit 1
      fi
      python tools/quality-gate-guard.py --pr "$PR_NUMBER" || exit 1
      python tools/dependency-risk-guard.py check "$ARTIFACTS_DIR/dep-baseline.json" || exit 1
      echo "=== Both checks passed ==="
    depends_on: [sonar-verify]
    timeout: 900000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: THE PULL REQUEST BECOMES REVIEWABLE
  #
  # Only reachable through verify-gate. If the gate is red this node never runs,
  # and the pull request stays a draft carrying Sonar's red verdict.
  # ═══════════════════════════════════════════════════════════════

  - id: ready-pr
    bash: |
      set -uo pipefail
      PR_NUMBER=$(tr -dc '0-9' < "$ARTIFACTS_DIR/.pr-number" 2>/dev/null)
      if [ -z "$PR_NUMBER" ]; then
        echo "ERROR: no pull request number to mark ready." >&2
        exit 1
      fi
      echo "=== Quality gate is green. Marking PR #${PR_NUMBER} ready for review ==="
      gh pr ready "$PR_NUMBER"
      gh pr view "$PR_NUMBER" --json url -q '.url'
    depends_on: [verify-gate]
    timeout: 300000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: archon-issue-completion-report
    depends_on: [ready-pr]
    context: fresh
